# Local development database only. Production uses a hosted Postgres (Neon).
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ebook-db
    environment:
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
      POSTGRES_DB: ebook
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres
      - "5433:5432"
    volumes:
      - ebook-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook -d ebook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ebook-db-data:
