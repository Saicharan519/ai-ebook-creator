name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ebook
          POSTGRES_PASSWORD: ebook
          POSTGRES_DB: ebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebook -d ebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_test
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      JWT_ACCESS_SECRET: ci-secret-that-is-at-least-32-characters-long
      AUTH_RATE_LIMIT_MAX: 1000
      AI_PROVIDER: fake
      AI_RATE_LIMIT_PER_MINUTE: 1000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # Starts the real API and web app (fake AI provider) and drives them in Chromium
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
